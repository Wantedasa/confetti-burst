<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confetti Burst — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100%; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:24px; text-align:center; }
  .tag { font-size:.8rem; color:#8b949e; }
  .note { font-size:.8rem; color:#6b7280; max-width:520px; }
  
</style>
</head>
<body>
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas><p class="tag">Click anywhere 🎉</p><button id="go" style="position:relative;z-index:1;padding:11px 20px;border-radius:10px;border:1px solid #2f81f7;background:#2f81f7;color:#fff;font-weight:600;cursor:pointer;position:relative">Burst!</button>

<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var ps=[];function boom(x,y){for(var i=0;i<80;i++){ps.push({x:x,y:y,vx:(Math.random()-.5)*6,vy:Math.random()*-7-2,c:['#2f81f7','#3fb950','#f0883e','#a371f7'][i%4],a:1});}}function loop(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(function(p){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.a-=.012;ctx.globalAlpha=Math.max(p.a,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5);});ps=ps.filter(function(p){return p.a>0&&p.y<cv.height+20;});requestAnimationFrame(loop);}loop();function at(e){var t=e.touches?e.touches[0]:e;boom(t.clientX,t.clientY);}addEventListener('click',at);document.getElementById('go').onclick=function(e){e.stopPropagation();boom(innerWidth/2,innerHeight/2);};
</script>
</body>
</html>
